name: gm CI

on:
  push:
    paths:
      - "plugins/gm/**"
      - ".github/workflows/gm-ci.yml"
  pull_request:
    paths:
      - "plugins/gm/**"
      - ".github/workflows/gm-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Cache the pinned Datasworn files
        uses: actions/cache@v4
        with:
          path: ~/.cache/gm-datasworn
          key: gm-datasworn-${{ hashFiles('plugins/gm/tools/datasworn-import') }}
      # classic.json (Ironsworn's Ask the Oracle check) is named by its sha256, as the importer names starforged.json.
      - name: Fetch the pinned Datasworn classic.json
        run: >-
          test -f "$HOME/.cache/gm-datasworn/7c669d602cf05576d74a966d3eac0657bc55ddbdab2829507362f00004ef52fc.json" ||
          curl -fsSL --retry 3 --create-dirs
          -o "$HOME/.cache/gm-datasworn/7c669d602cf05576d74a966d3eac0657bc55ddbdab2829507362f00004ef52fc.json"
          https://raw.githubusercontent.com/rsek/datasworn/e643a75263c1cb3e845a0c0789879ff4e8b49532/datasworn/classic/classic.json
      - name: Run dice/validator tests
        run: >-
          DATASWORN_CLASSIC_JSON="$HOME/.cache/gm-datasworn/7c669d602cf05576d74a966d3eac0657bc55ddbdab2829507362f00004ef52fc.json"
          uvx pytest plugins/gm/tests -q
      - name: Validate all adapters
        run: python3 plugins/gm/bin/validate-adapter --all plugins/gm/adapters
      - name: Starforged content matches its pinned Datasworn source
        run: python3 plugins/gm/tools/datasworn-import --check --cache ~/.cache/gm-datasworn
      - name: Validate all personas
        run: python3 plugins/gm/bin/validate-adapter --personas --all plugins/gm/personas
