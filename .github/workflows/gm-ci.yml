name: gm CI

on:
  push:
    paths:
      - "plugins/gm/**"
      - ".github/workflows/gm-ci.yml"
  pull_request:
    paths:
      - "plugins/gm/**"
      - ".github/workflows/gm-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Fetch the pinned Datasworn classic.json (Ironsworn's Ask the Oracle check)
        run: >-
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/classic.json"
          https://raw.githubusercontent.com/rsek/datasworn/e643a75263c1cb3e845a0c0789879ff4e8b49532/datasworn/classic/classic.json
      - name: Run dice/validator tests
        run: DATASWORN_CLASSIC_JSON="$RUNNER_TEMP/classic.json" uvx pytest plugins/gm/tests -q
      - name: Validate all adapters
        run: python3 plugins/gm/bin/validate-adapter --all plugins/gm/adapters
      - name: Starforged content matches its pinned Datasworn source
        run: python3 plugins/gm/tools/datasworn-import --check
      - name: Validate all personas
        run: python3 plugins/gm/bin/validate-adapter --personas --all plugins/gm/personas
