name: ci-gate

# The one required check on `main` (spec section 1d): aggregates every CI
# workflow a PR is expected to run into one `factory/ci-gate` verdict, so
# path-filtered CI can be required without leaving docs-only PRs pending.
#
# Base-branch code: it runs on pull_request_target / workflow_run, whose YAML
# and evaluator come from `main`, and it never checks out the PR (the evaluator
# is fetched from the base commit with the API). The verdict is posted by the
# `factory-ci` GitHub App from the `main`-only `factory-ci` environment, never
# with GITHUB_TOKEN, so the `main-integrity` ruleset can require the check from
# that App and a PR-added workflow publishing the same name cannot satisfy it.
#
# Re-evaluated on every PR head change and after every listed workflow
# completes. `workflow_run.workflows` must name exactly the workflows in
# `.github/factory-ci.yml` (the evaluator lints this). workflow_run matches by
# workflow *name*, so a PR that adds or renames a CI workflow is re-evaluated by
# main's copy of this file, which does not yet listen for the new name: re-run
# the last ci-gate run, or dispatch this workflow with the PR's head SHA, once
# that workflow has finished (the evaluator's summary flags this case).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  workflow_run:
    workflows: ["gm CI", "plugin versions", "factory scripts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Head commit SHA of the open PR to re-evaluate (40 lowercase hex, exactly as git prints it)"
        required: true
        type: string

permissions: {}

# Serialize evaluations per head SHA -- every trigger, dispatch included, keys
# on the same SHA -- so a stale verdict can never be posted after a fresher one.
concurrency:
  group: "ci-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.head_sha }}"
  cancel-in-progress: false

jobs:
  evaluate:
    # A manual dispatch can be started from any ref; only main's copy of this
    # workflow and of the evaluator may run (the report environment is
    # main-only regardless).
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      head_sha: ${{ steps.gate.outputs.head_sha || steps.event.outputs.head_sha }}
      pr: ${{ steps.gate.outputs.pr }}
      title_json: ${{ steps.gate.outputs.title_json }}
      summary_json: ${{ steps.gate.outputs.summary_json }}
    steps:
      - name: Head SHA from the event
        id: event
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.head_sha }}
        # The dispatch input is typed by a person: validate the *whole* value
        # before it touches GITHUB_OUTPUT (a newline in it could otherwise add
        # an output line; a per-line tool such as grep -x would pass a value
        # with one valid line). Canonical form only, never normalized: the
        # concurrency group above keys on the raw input. The evaluator rejects
        # a bad value with a real message.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          value = os.environ["HEAD_SHA"]
          print("head_sha=" + (value if re.fullmatch(r"[0-9a-f]{40}", value) else ""))
          PY
      - name: Fetch the evaluator from the base commit (no checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in ci_gate.py requirements.txt; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/${file}?ref=${GITHUB_SHA}" \
              -H "Accept: application/vnd.github.raw+json" > "${file}"
          done
          # This job holds a repository token and reads private repository
          # data, so it never installs whatever PyPI serves at run time: the
          # runner's own PyYAML is used when present, and otherwise pip may
          # install only the hash-pinned artifacts recorded in the base
          # commit's requirements.txt.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --user --quiet --no-deps --only-binary=:all: --require-hashes -r requirements.txt
      - name: Evaluate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci_gate.py

  report:
    needs: evaluate
    # Runs even when evaluate failed (the verdict is then `failure`), but not
    # when it was cancelled by a newer evaluation of the same head, not when it
    # was skipped (a dispatch off main), and not when there is nothing to report.
    if: ${{ !cancelled() && needs.evaluate.result != 'skipped' && needs.evaluate.outputs.verdict != 'skip' }}
    runs-on: ubuntu-latest
    environment: factory-ci
    permissions: {}
    steps:
      - name: Mint a factory-ci App token
        id: app
        # Pinned by commit: this step holds the App's private key.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.FACTORY_CI_APP_ID }}
          private-key: ${{ secrets.FACTORY_CI_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Post factory/ci-gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          VERDICT: ${{ needs.evaluate.outputs.verdict }}
          HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          TITLE_JSON: ${{ needs.evaluate.outputs.title_json }}
          SUMMARY_JSON: ${{ needs.evaluate.outputs.summary_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          verdict = os.environ["VERDICT"]
          if os.environ["EVALUATE_RESULT"] != "success" or verdict not in ("success", "failure", "pending"):
              verdict, title = "failure", "ci-gate evaluator did not complete"
              summary = f"The evaluate job ended with `{os.environ['EVALUATE_RESULT']}`; see the run log."
          else:
              # One JSON-encoded line each (see output_lines in ci_gate.py).
              title = json.loads(os.environ["TITLE_JSON"] or '""')
              summary = json.loads(os.environ["SUMMARY_JSON"] or '""')
          payload = {
              "name": "factory/ci-gate",
              "head_sha": os.environ["HEAD_SHA"],
              "external_id": os.environ["GITHUB_RUN_ID"],
              "details_url": os.environ["RUN_URL"],
              "output": {"title": title, "summary": summary},
              "started_at": now,
          }
          if verdict == "pending":
              payload["status"] = "in_progress"
          else:
              payload["status"] = "completed"
              payload["conclusion"] = verdict
              payload["completed_at"] = now
          print(json.dumps(payload))
          PY
          test -n "$HEAD_SHA" || { echo "no head SHA to post on"; exit 1; }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input payload.json --jq '.html_url'
