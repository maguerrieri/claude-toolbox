name: ledger CI

on:
  push:
    paths:
      - "plugins/ledger/**"
      - "plugins/ticket-workflow/hooks/role-guard.sh"
      - "plugins/ticket-workflow/hooks/role-guard-marker-write.jq"
      - ".github/workflows/ledger-ci.yml"
  pull_request:
    paths:
      - "plugins/ledger/**"
      - "plugins/ticket-workflow/hooks/role-guard.sh"
      - "plugins/ticket-workflow/hooks/role-guard-marker-write.jq"
      - ".github/workflows/ledger-ci.yml"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ledger script tests
        run: bash plugins/ledger/tests/test-ledger.sh
      - name: Ledger hook tests
        run: bash plugins/ledger/tests/test-ledger-hooks.sh
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned, so a CLI release can't change the verdict under an unchanged
      # plugin: the function-hook API the band's module is written against is
      # early access and moves between releases. Neither command needs a login.
      - name: Validate the plugin, its hooks and its hooks module
        run: npx -y @anthropic-ai/claude-code@2.1.325 plugin validate plugins/ledger
      - name: Band tests
        run: npx -y @anthropic-ai/claude-code@2.1.325 plugin test plugins/ledger
      # The band on the desktop surface through the engine itself, over the
      # stdio transport a session the desktop app hosts uses (#345). It starts
      # no model turn, so it needs no login either.
      - name: Band on the desktop surface, through the engine
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.325
          python3 -I plugins/ledger/tests/test-band-desktop.py
