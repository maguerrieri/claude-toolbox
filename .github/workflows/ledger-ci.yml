name: ledger CI

on:
  push:
    paths:
      - "plugins/ledger/**"
      - "plugins/ticket-workflow/hooks/role-guard.sh"
      - "plugins/ticket-workflow/hooks/role-guard-marker-write.jq"
      - ".github/workflows/ledger-ci.yml"
  pull_request:
    paths:
      - "plugins/ledger/**"
      - "plugins/ticket-workflow/hooks/role-guard.sh"
      - "plugins/ticket-workflow/hooks/role-guard-marker-write.jq"
      - ".github/workflows/ledger-ci.yml"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ledger script tests
        run: bash plugins/ledger/tests/test-ledger.sh
      - name: Ledger hook tests
        run: bash plugins/ledger/tests/test-ledger-hooks.sh
  validate:
    runs-on: ubuntu-latest
    # Pinned, so a CLI release can't change the verdict under an unchanged
    # plugin: the function-hook API the band's module is written against is
    # early access and moves between releases. No step needs a login.
    env:
      CLAUDE_CODE_PACKAGE: "@anthropic-ai/claude-code@2.1.325"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Installed once for every step below. The desktop test runs the CLI
      # under a home of its own, where npx's cache would be empty.
      - name: Install the pinned CLI
        run: npm install -g "$CLAUDE_CODE_PACKAGE"
      - name: Validate the plugin, its hooks and its hooks module
        run: claude plugin validate plugins/ledger
      - name: Band tests
        run: claude plugin test plugins/ledger
      # The band on the desktop surface through the engine itself, over the
      # stdio transport a session the desktop app hosts uses (#345).
      - name: Band on the desktop surface, through the engine
        run: python3 -I plugins/ledger/tests/test-band-desktop.py
