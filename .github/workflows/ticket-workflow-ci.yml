name: ticket-workflow CI

on:
  push:
    paths:
      - "plugins/ticket-workflow/hooks/**"
      - "plugins/ticket-workflow/tests/**"
      - "plugins/ticket-workflow/commands/**"
      - "plugins/ticket-workflow/skills/**"
      - "plugins/spawn/skills/spawn/backends/local.md"
      - ".github/workflows/ticket-workflow-ci.yml"
  pull_request:
    paths:
      - "plugins/ticket-workflow/hooks/**"
      - "plugins/ticket-workflow/tests/**"
      - "plugins/ticket-workflow/commands/**"
      - "plugins/ticket-workflow/skills/**"
      - "plugins/spawn/skills/spawn/backends/local.md"
      - ".github/workflows/ticket-workflow-ci.yml"

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Role-guard hook tests
        run: bash plugins/ticket-workflow/tests/test-role-guard.sh
      - name: Session-identity tests
        run: bash plugins/ticket-workflow/tests/test-session-identity.sh
