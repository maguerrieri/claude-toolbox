name: ticket-workflow CI

# Runs every plugins/ticket-workflow/tests/test-*.sh (bash + jq, no
# dependencies). Add a test file; the workflow picks it up without edits. The
# software-factory spec is in the trigger set because the evidence-block test
# parses its 1a example.
on:
  push:
    paths:
      - "plugins/ticket-workflow/**"
      - "docs/superpowers/specs/2026-09-11-software-factory-design.md"
      - ".github/workflows/ticket-workflow-ci.yml"
  pull_request:
    paths:
      - "plugins/ticket-workflow/**"
      - "docs/superpowers/specs/2026-09-11-software-factory-design.md"
      - ".github/workflows/ticket-workflow-ci.yml"

# The job runs shell from the PR head and needs no GitHub API access, so the
# token is read-only and is not persisted into the checkout's git config.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # On pull_request the default checkout is the synthetic merge commit; the
      # evidence test resolves context_reads against HEAD, which must be the PR
      # head tree (spec 1a), so check that out explicitly. push has no PR, so it
      # falls back to the pushed commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run shell tests
        run: |
          status=0
          for test_file in plugins/ticket-workflow/tests/test-*.sh; do
            echo "== $test_file"
            bash "$test_file" || status=1
          done
          exit "$status"
