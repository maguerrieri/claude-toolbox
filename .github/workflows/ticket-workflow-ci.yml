name: ticket-workflow CI

on:
  push:
    paths:
      - "plugins/ticket-workflow/hooks/**"
      - "plugins/ticket-workflow/scripts/**"
      - "plugins/ticket-workflow/tests/**"
      - "plugins/ticket-workflow/commands/**"
      - "plugins/ticket-workflow/skills/**"
      - "plugins/spawn/**"
      - ".github/workflows/ticket-workflow-ci.yml"
  pull_request:
    paths:
      - "plugins/ticket-workflow/hooks/**"
      - "plugins/ticket-workflow/scripts/**"
      - "plugins/ticket-workflow/tests/**"
      - "plugins/ticket-workflow/commands/**"
      - "plugins/ticket-workflow/skills/**"
      - "plugins/spawn/**"
      - ".github/workflows/ticket-workflow-ci.yml"

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Role-marker script tests
        run: bash plugins/ticket-workflow/tests/test-role-marker.sh
      - name: Role-guard hook tests
        run: bash plugins/ticket-workflow/tests/test-role-guard.sh
      - name: Session-identity tests
        run: bash plugins/ticket-workflow/tests/test-session-identity.sh
      - name: REST list-helper tests
        run: bash plugins/ticket-workflow/tests/test-gh-rest-list.sh
      - name: GitHub-verified check tests
        run: bash plugins/ticket-workflow/tests/test-gh-verified.sh
      - name: Install zsh (the round-count and agents-listing tests also run their snippets under zsh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Review-round count tests
        run: bash plugins/ticket-workflow/tests/test-round-count.sh
      - name: Session-lookup (claude agents listing) tests
        run: bash plugins/ticket-workflow/tests/test-agents-listing.sh
