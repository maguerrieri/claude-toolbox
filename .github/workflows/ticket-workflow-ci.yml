name: ticket-workflow CI

# Two test suites for the ticket-workflow plugin:
#   - shell: every plugins/ticket-workflow/tests/test-*.sh (bash + jq, no
#     dependencies). Add a test file; the workflow picks it up without edits.
#     The software-factory spec is in the trigger set because the
#     evidence-block test parses its 1a example.
#   - script: pytest over plugins/ticket-workflow/tests (the provisioning
#     script's tests), run with uv.
on:
  push:
    paths:
      - "plugins/ticket-workflow/**"
      - "docs/superpowers/specs/2026-09-11-software-factory-design.md"
      - ".github/workflows/ticket-workflow-ci.yml"
  pull_request:
    paths:
      - "plugins/ticket-workflow/**"
      - "docs/superpowers/specs/2026-09-11-software-factory-design.md"
      - ".github/workflows/ticket-workflow-ci.yml"

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      # On pull_request the default checkout is the synthetic merge commit; the
      # evidence test resolves context_reads against HEAD, which must be the PR
      # head tree (spec 1a), so check that out explicitly. push has no PR, so it
      # falls back to the pushed commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run shell tests
        run: |
          status=0
          for test_file in plugins/ticket-workflow/tests/test-*.sh; do
            echo "== $test_file"
            bash "$test_file" || status=1
          done
          exit "$status"

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run script tests
        run: uvx pytest plugins/ticket-workflow/tests -q
